source: https://rtcstats.com/pricing + https://rtcstats.com/kb/usage-and-billing/credits-in-rtcstats
  + openapi/rtcstats-api-openapi.yml
description: 'rtcStats does not rate-limit by requests per second and publishes no rate-limit response
  headers. Consumption is metered in credits — one credit per file analyzed — with a monthly allowance
  per plan. The limit is machine-readable at runtime: GET /v1.0/quota (and the get_quota MCP tool) return
  allowedCredits and remainingCredits, and exhaustion is signalled with HTTP 402 "No credits available".'
model: credit-quota
unit: credit (1 credit = 1 file uploaded and analyzed)
headers:
  rate_limit_headers: null
  retry_after: null
  note: No X-RateLimit-*, RateLimit-* (draft) or Retry-After headers are documented.
runtime_signal:
  endpoint: GET /v1.0/quota
  operationId: quota
  mcp_tool: get_quota
  fields:
  - allowedCredits
  - remainingCredits
  exhaustion_status: 402
  exhaustion_body: '{"error": "...", "errorCode": "..."}'
rate_limits:
- plan: Free
  limit_count: 10
  limit_unit: credits
  time_frame: month
  rollover: false
  notes: Basic analysis only; full analysis limited to month 1. 1 month retention, 3 team members.
- plan: Developer
  limit_count: 500
  limit_unit: credits
  time_frame: month
  rollover: false
  notes: Unlocks API and MCP access, Experience Score, AI summaries, Observations and Deductions. 3
