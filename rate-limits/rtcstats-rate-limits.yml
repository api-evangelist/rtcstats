- plan: Enterprise
  limit_count: 5000
  limit_unit: credits
  time_frame: month
  rollover: false
  notes: Adds the embeddable viewer, 3rd-party storage and whitelabel sharing. 3 months retention, 50
    team members.
top_ups:
- credits: 5000
  price_usd: 100
  rollover: true
- credits: 50000
  price_usd: 500
  rollover: true
- credits: 500000
  price_usd: 2500
  rollover: true
consumption_rules:
- Monthly credits do not roll over; purchased top-up credits do and never expire while the account stays
  paid.
- Monthly credits are drawn down first; purchased credits are used only after the monthly allowance
  is exhausted.
- Purchased credits become invalid if the account downgrades to Free.
- A successful upload, analyze or enrich consumes exactly one credit.
- Individual chunk uploads in the chunked flow consume no credit — only the assemble step does.
- All three MCP tools (get_quota, list_sessions, get_session) are read-only and consume no credits.
- GET /v1.0/quota, GET /v1.0/observations, GET /v1.0/sessions and DELETE /v1.0/sessions/{rtcstatsId}
  consume no credits.
size_limits:
  request_body_cap: ~4.5MB per request; larger dumps must use the chunked multipart flow
  assemble_request_cap: 1KB
  file_size_limit: plan-dependent, not published as a number; exceeded returns HTTP 413
