  name: rtcStats MCP Server
  description: Hosted Model Context Protocol server over Streamable HTTP, so coding agents can query analyzed WebRTC sessions. Tools get_quota,
    list_sessions, get_session and get_observation_explanation. Bearer JWT auth with the same application token as the REST API (an unauthenticated
    initialize returns 401 with WWW-Authenticate Bearer). Available on the Developer plan and above.
