name: rtcStats
description: >-
  SaaS for developers to troubleshoot and monitor WebRTC applications. Users upload webrtc-internals/rtcstats dumps or
  stream stats to receive metrics, Observations, Deductions, an Experience Score, and an AI root-cause summary. Offers a
  REST API, a hosted MCP server, and an open-source collection SDK/collector.
