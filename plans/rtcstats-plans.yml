notes:
- Annual billing is advertised as "Save 17%" — Developer $199/mo and Enterprise $999/mo billed annually
  vs $239/mo and $1,199/mo monthly.
- Purchased top-up credits never expire but are voided on downgrade to Free.
- 'No usage-based overage: exceeding the credit balance returns HTTP 402 rather than billing extra.'
- No SLA on any tier — the Terms of Service state service-level agreements are not offered for most
  services.
