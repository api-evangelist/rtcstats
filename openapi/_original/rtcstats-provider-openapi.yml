ror"},"example":{"error":"Rate limit exceeded, retry after 42 s","errorCode":"rate_limited"}}}},"500":{"description":"Unexpected processing error, or the upload storage is unavailable on a chunk or an assemble. <code>errorCode</code> is <code>other_issue</code>; a generic message is returned and internal error details are not exposed","headers":{"X-RateLimit-Limit":{"$ref":"#/components/headers/X-RateLimit-Limit"},"X-RateLimit-Remaining":{"$ref":"#/components/headers/X-RateLimit-Remaining"},"X-RateLimit-Reset":{"$ref":"#/components/headers/X-RateLimit-Reset"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}},"/v1.0/mcp":{"post":{"summary":"MCP Streamable HTTP","description":"Model Context Protocol <b>Streamable HTTP</b> transport. <br/>Use an MCP client with this URL. <br/>Send <code>Authorization: Bearer</code> with your application JWT on every request. <br/>Exposes tools:<ul><li>- <code>get_quota</code></li><li>- <code>list_sessions</code></li><li>- <code>get_session</code></li><li>- <code>get_observation_explanation</code></li></ul> Resource: <code>rtcstats://observations/{type}</code>, the Markdown explanation of one observation type (JSON-RPC error -32002 for an unknown type, no list). Prompts: <code>what_changed_since</code>, <code>sessions_worth_opening</code>, <code>explain_session_observations</code>. <br/><br/>Every request, <code>initialize</code> included, must carry the token: a missing or invalid token is HTTP 401 with a <code>WWW-Authenticate</code> challenge, and a plan without API access is HTTP 403, both before any JSON-RPC is processed. Rate limits on <code>tools/call</code> and <code>resources/read</code> (<code>read</code> bucket, 120 per minute per account) are returned as tool results with <code>isError: true</code> or as a JSON-RPC error, never as HTTP 429. <code>initialize</code>, <code>tools/list</code>, <code>prompts/*</code> and the resource listings are never limited.","operationId":"mcpStreamablePost","tags":["rtcStats API"],"security":[{"BearerAuth":[]}],"requestBody":{"description":"MCP JSON-RPC payload (when applicable).","content":{"application/json":{"schema":{"type":"object"}}}},"responses":{"200":{"description":"Success. One JSON-RPC 2.0 response object per request: the endpoint runs in JSON-response mode and never streams SSE","headers":{"Content-Type":{"description":"Always `application/json` (JSON-response mode, no SSE stream).","schema":{"type":"string","example":"application/json"}},"mcp-session-id":{"description":"Session identifier when the transport uses sessions (omitted in stateless mode).","schema":{"type":"string"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/McpJsonRpcResponse"},"example":{"jsonrpc":"2.0","id":1,"result":{"protocolVersion":"2024-11-05","capabilities":{},"serverInfo":{"name":"rtcstats","version":"1.0.0"}}}}}},"400":{"description":"Bad request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/McpStreamableHttpTransportError"},"examples":{"parseError":{"summary":"Invalid JSON or invalid JSON-RPC","value":{"jsonrpc":"2.0","error":{"code":-32700,"message":"Parse error: Invalid JSON"},"id":null}},"invalidRequest":{"summary":"Invalid initialization batch","value":{"jsonrpc":"2.0","error":{"code":-32600,"message":"Invalid Request: Only one initialization request is allowed"},"id":null}},"unsupportedProtocol":{"summary":"Unsupported MCP-Protocol-Version","value":{"jsonrpc":"2.0","error":{"code":-32000,"message":"Bad Request: Unsupported protocol version: 2099-01-01 (supported versions: 2024-11-05, ...)"},"id":null}}}}}},"401":{"description":"Missing or invalid token, on any request including <code>initialize</code>. <code>errorCode</code> is <code>authentication</code>","headers":{"WWW-Authenticate":{"description":"Bearer challenge (RFC 6750). <code>error=\"invalid_token\"</code> when a token was presented and refused.","schema":{"type":"string","example":"Bearer realm=\"rtcstats\", erro