ations and scores.","additionalProperties":true,"properties":{"callStart":{"type":"string","format":"date-time","description":"First observed call activity timestamp."},"callEnd":{"type":"string","format":"date-time","description":"Last observed call activity timestamp."},"durationMs":{"type":"integer","description":"Total call duration in milliseconds."},"userAgentData":{"type":"object","description":"Browser, platform, hardware and screen information."},"pConnectionsNumber":{"type":"integer","description":"Number of RTCPeerConnections observed during the session, equal to the number of `pConnections` entries."},"pConnections":{"type":"object","description":"Per-PeerConnection details keyed by peer connection id, one entry for every peer connection an observation `source.pid` can name. Also carries the rtcstats-features catalogue facts for that peer connection; a catalogue key that is absent is not known, it is never zero or false.","additionalProperties":{"type":"object","properties":{"hasStatistics":{"type":"boolean","description":"False when the dump holds no getStats sample for this peer connection (a collector fact, not a connection property): the entry comes from its logs only, with zero stream counts, no `transports` entry and a null `connectivityScore`. Absent on sessions processed before schema 6.20."}}}},"streams":{"type":"object","description":"Peer-stream metrics (audio, video, data) keyed by stream id. Media streams also carry the rtcstats-features catalogue facts for that track; a catalogue key that is absent is not known, it is never zero or false.","additionalProperties":{"type":"object"}},"transports":{"type":"object","description":"ICE transport and candidate-pair information per PeerConnection.","additionalProperties":{"type":"object"}},"aggregatedStats":{"type":"object","description":"Session-wide aggregated metrics with self-describing keys <metric>_<scope>_<agg>_<unit>: metric = jitter|rtt|bitrate|packetLoss|mos; scope = in_audio|out_audio|in_video|out_video; agg = avg|min|max|p5|p95|stddev; unit = ms (jitter, rtt), kbps (bitrate), percent (packetLoss), score (mos, 1-4.5). Example: rtt_out_audio_avg_ms. Session-level weighted averages: jitter_avg_ms, rtt_avg_ms. Stream counts: in_audio_count, out_audio_count, in_video_count, out_video_count. Since schema 6.9 the former unitless keys (e.g. rtt_out_audio, in_audio) are no longer present."},"metadata":{"type":"object","description":"Ingest metadata: the client protocol and the custom flag, plus the conference, session and user identifiers when the rtcstats token carried them."},"connectivity":{"type":"string","description":"Resolved connectivity type for the session, from the local candidate of the selected pairs only: a remote relay reached from a local non-relay candidate is `DIRECT/*`.","example":"DIRECT/UDP"},"connectionIPType":{"type":"string","enum":["IPv4","IPv6"],"description":"IP family of the selected connection. Absent when it could not be resolved."},"from":{"type":"object","description":"Coarse location of the client. Absent for dumps that carry no location data.","properties":{"continent":{"type":"string"},"country":{"type":"string"},"city":{"type":"string"}}},"uploadTimestamp":{"type":"string","format":"date-time","description":"When the dump was analyzed/processed (ISO 8601)."},"title":{"type":"string","description":"Human-readable session title (often derived from the call URL)."},"fileName":{"type":"string","description":"Internal name of the stored dump file."},"fileSize":{"type":"integer","description":"Size of the dump content in bytes, after decompression: the same value whether the dump was sent plain or gzipped."},"experienceScore":{"type":"number","format":"float","nullable":true,"description":"Overall experience score (0-100). Null when there is no media data to score against."},"audioScore":{"type":"number","format":"float","nullable":true,"description":"Audio quality score (1-5). Null when no audio stream is present."},"videoScore":{"type":"number","format":"float","nullable":true,"description":"Video quality score (1-5). Null when no video stream is present."},"connectivityScore":{"type":"number","format":"float","nullable":true,"description":"Connectivity score (1-5). Null when no peer connection produced a connectivity score (e.g. no valid candidate pair)."},"observationsScore":{"type":"integer","description":"Aggregated severity score derived from observations. Maximum (40) when no observations were produced; lower as severity penalties are applied."},"tagClouds":{"type":"array","description":"Tag-cloud entries derived from the session.","items":{"type":"object","required":["tag","total"],"properties":{"tag":{"type":"string"},"total":{"type":"number"},"severity":{"type":"string","description":"Optional severity bucket for the tag."}}}},"id":{"type":"string","format":"uuid","description":"Stored session identifier, the same value as the envelope `rtcstatsId`. On `POST /analyze` it follows `rtcstatsId`: present when `?save=true` persisted the session, absent otherwise."},"created_at":{"type":"string","format":"date-time","nullable":true,"description":"Row creation timestamp. Null on `POST /analyze`."},"uploaded_by":{"type":"string","format":"uuid","nullable":true,"description":"Internal identifier of the user who uploaded the dump. Opaque to clients: an rtcstats-internal id, not an email or an account id. Null on `POST /analyze`."},"uploaded_by_email":{"type":"string","format":"email","nullable":true,"description":"Email of the user who uploaded the dump. Null on `POST /analyze`."},"public_link":{"type":"string","nullable":true,"description":"Share token of the public viewer. Null when the session is not shared, and on `POST /analyze`."},"description":{"type":"string","nullable":true,"description":"Free-text description set in the dashboard. Null when none was set."},"tags":{"type":"array","description":"User-defined tags attached to the session. Empty when none.","items":{"type":"string"}},"observations":{"type":"array","description":"Detected issues and insights. Each entry is an observation with a type, a severity, a category, a source object identifying what it concerns, and optional supporting values/indicators.","items":{"type":"object","description":"A single detected observation.","properties":{"type":{"type":"string","description":"Observation type key, e.g. 'turnNoConfig', 'unusedStream', 'framesDropped'. The set grows over time: treat it as open and ignore a type you do not know."},"severity":{"type":"string","enum":["high","medium","low","info"],"description":"Severity of the observation."},"category":{"type":"string","enum":["connections","streams","devices","datachannels","logs","pairs"],"description":"Category the observation belongs to."},"source":{"$ref":"#/components/schemas/ObservationSource"},"label":{"deprecated":true,"description":"DEPRECATED, removed in the next schema version. Overloaded legacy identifier whose runtime type is polymorphic: a number (the numeric SSRC) for stream observations, a string (the datachannel report id) for datachannels, a string (the device name) for device observations. No fixed type is declared because the runtime type varies by category. Read source.ssrcId / source.sid / source.labelId instead."},"tags":{"type":"array","items":{"type":"string"},"description":"Tags attached to the observation (e.g. network, audio, video, connectivity, security)."},"url":{"type":"string","description":"Related URL when applicable (e.g. the TURN server URL)."},"firstSeenAt":{"type":"integer","format":"int64","description":"Epoch timestamp (ms) of the first occurrence of the observation, truncated to a whole millisecond."},"valueInCount":{"type":"number","description":"Observation value as a count (e.g. number of duplicated lines or occurrences)."},"averageInMs":{"type":"number","description":"Average value in milliseconds (e.g. jitter, rtt, encode/decode time)."},"maxInMs":{"type":"number","description":"Maximum value in milliseconds."},"valueInPercent":{"type":"number","description":"Observation value as a percentage (e.g. audio/video loss, frames dropped)."},"durationInPercent":{"type":"number","description":"Duration of the observation as a percentage of the call."},"durationInMs":{"type":"number","description":"Duration in milliseconds (e.g. TURN/STUN delay, signaling time)."},"durationInSeconds":{"type":"number","description":"Duration in seconds."},"indicators":{"type":"object","description":"Supporting indicators (e.g. min, max, average, stddev)."},"property":{"type":"string","description":"The specific property the observation refers to (e.g. audioLevel)."}}}},"features":{"type":"object","description":"Session features in four top-level keys: the observation feature flags grouped into `devices`, `globals` and `audio`, plus the rtcstats-features catalogue `client`. `client` is present only when the session has a stored features file; the catalogue's connection and track facts are folded into `pConnections` and `streams`. Within the catalogue, only computed features are emitted: a key that is absent is not known, it is never zero or false. Read the envelope's `processorVersion` for the version that produced them.","properties":{"devices":{"type":"object","description":"Device feature flags (`FEATURE_MICROPHONE_USB`, `FEATURE_CAMERA_INTERNAL`, `FEATURE_SCREEN_RESOLUTION`, ...). Booleans, except `FEATURE_SCREEN_RESOLUTION` which is a string."},"globals":{"type":"object","description":"Session-wide network and media flags (`use_vpn`, `udp_blocked`, `symmetric_nat`, `ect1CompliantNetwork`, ...). `audioIn` / `videoIn` / `audioOut` / `videoOut` and `network_interfaces` are counts."},"audio":{"type":"object","description":"The `firstTimestampFor*` epoch milliseconds for first sound, audible sound and audible voice, inbound and outbound. Legitimately `null` when the condition never occurred."},"client":{"type":"object","description":"Client-level rtcstats-features (one per session). A `webrtc-internals` dump legitimately yields fewer keys than an `rtcstats` dump."}}},"observationsCount":{"type":"object","description":"Counts of observations grouped by severity (high, medium, low, info)."},"aiSummary":{"type":"object","nullable":true,"description":"AI-generated session summary. Always `null` on `POST /analyze` responses and while background generation is pending or plan-gated. Stable `summary` fields: `highlight`, `network`, `media`, `user` (markdown strings) and `networkScore`, `mediaScore`, `userScore` (one of excellent, good, acceptable, poor, bad). Other fields may appear and are subject to change without notice. Use them with care.","properties":{"model":{"type":"string","description":"Model id used for generation (e.g. anthropic/claude-haiku-5.5)."},"summary":{"type":"object","description":"AI-authored summary. Extra undocumented fields may appear and are subject to change. In the text fields, `<` is escaped as `&lt;`; markdown renderers display `<`.","additionalProperties":true,"properties":{"highlight":{"type":"string","description":"One-line overall summary (markdown)."},"network":{"type":"string","description":"Network and connectivity analysis (markdown)."},"networkScore":{"type":"string","description":"Qualitative network rating: excellent, good, acceptable, poor or bad."},"media":{"type":"string","description":"Audio/video quality analysis (markdown)."},"mediaScore":{"type":"string","description":"Qualitative media rating (same values as networkScore)."},"user":{"type":"string","description":"Device and local-user analysis (markdown)."},"userScore":{"type":"string","description":"Qualitative user-side rating (same values as networkScore)."}}},"version":{"type":"string","description":"AI prompt configuration version used for generation."}}}}},"EnrichResponse":{"type":"object","description":"POST /v1.0/enrich response: the scores and observations projection, plus the processor version and a generation timestamp.","required":["data