{"openapi":"3.0.3","info":{"title":"rtcStats API","version":"1.0","description":"API for third-party applications to <b>upload</b>, <b>analyze</b>, or use the <b>MCP Streamable HTTP</b> endpoint at <code>/v1.0/mcp</code>. <br/><br/>Uses Bearer token authentication. <br/><br/><b>Number formatting:</b> numeric values in responses are rounded, epoch timestamps to a whole millisecond and every other number to at most 2 decimals; integer counts and large identifiers are preserved. <br/><br/><b>Note:</b> Need to create an application token in Settings from your paid account. <br/><br/><b>Rate limits:</b> per account and per minute, 30 ingest requests (upload assemble, analyze, enrich), 120 read requests (sessions, quota, observations, MCP tool calls) and 600 multipart chunks. Over the limit the API returns <code>429</code> with <code>Retry-After</code>; every response emitted after the check (all but <code>401</code> and <code>403</code>) carries <code>X-RateLimit-Limit</code>, <code>X-RateLimit-Remaining</code> and <code>X-RateLimit-Reset</code>."},"servers":[{"url":"https://api.rtcstats.com"}],"security":[{"BearerAuth":[]}],"tags":[{"name":"rtcStats API","description":"Upload and analyze WebRTC dumps, enrich data from a self-hosted collector, read and manage analyzed sessions, check credit quota, and reach the MCP Streamable HTTP endpoint."}],"externalDocs":{"description":"rtcStats documentation, knowledge base and getting started guide","url":"/kb/getting-started"},"paths":{"/v1.0/upload":{"post":{"summary":"Upload","description":"Upload and store a WebRTC dump file or a rtcstats file to your account using a chunked flow. <br/><br/>The API works in two steps: <ul><li>- First upload chunks via multipart/form-data</li><li>- Then assemble via application/json</li></ul>The API consumes one credit if successful. An assemble repeated within 24 h with the same <code>fileId</code> returns <code>200</code> with the original body and consumes no credit.","operationId":"upload","tags":["rtcStats API"],"security":[{"BearerAuth":[]}],"requestBody":{"content":{"multipart/form-data":{"schema":{"type":"object","required":["chunk","fileId","chunkIndex"],"properties":{"chunk":{"type":"string","format":"binary","description":"Binary chunk of the dump file. 3 MB maximum per chunk, 1 MB recommended; a larger chunk returns 413 file_too_large."},"fileId":{"type":"string","description":"Client-generated id for this chunked upload (same value for all chunks and assemble)."},"chunkIndex":{"type":"string"}}}},"application/json":{"schema":{"type":"object","required":["fileId","assemble","fileName"],"properties":{"fileId":{"type":"string","description":"Same id used when uploading chunks."},"assemble":{"type":"boolean"},"fileName":{"type":"string"}}}}}},"responses":{"200":{"description":"Success","headers":{"X-RateLimit-Limit":{"$ref":"#/components/headers/X-RateLimit-Limit"},"X-RateLimit-Remaining":{"$ref":"#/components/headers/X-RateLimit-Remaining"},"X-RateLimit-Reset":{"$ref":"#/components/headers/X-RateLimit-Reset"}},"content":{"application/json":{"schema":{"type":"object","required":["success"],"properties":{"success":{"type":"boolean"},"rtcstatsId":{"type":"string","description":"Stored rtcstats session identifier. Present after assemble; absent during chunk upload. Use with GET or DELETE /sessions/{rtcstatsId}."},"rtcstatsUrl":{"type":"string","description":"Dashboard URL to open the rtcstats session. Present after assemble; absent during chunk upload."},"embedUrl":{"type":"string","description":"URL to open the session in the embedded viewer. Only present on the Enterprise plan after assemble."}}}}}},"400":{"description":"Invalid request: an empty or malformed JSON assemble body, missing <code>fileId</code>, <code>assemble</code> or <code>fileName</code>, no chunks found for the given fileId, a malformed multipart chunk, or an unsupported Content-Type. <code>errorCode</code> is <code>invalid_request</code>","headers":{"X-RateLimit-Limit":{"$ref":"#/components/headers/X-RateLimit-Limit"},"X-RateLimit-Remaining":{"$ref":"#/components/headers/X-RateLimit-Remaining"},"X-RateLimit-Reset":{"$ref":"#/components/headers/X-RateLimit-Reset"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"description":"Missing or invalid token. <code>errorCode</code> is <code>authentication</code>","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"402":{"description":"No credits available. <code>errorCode</code> is <code>no_credits</code>","headers":{"X-RateLimit-Limit":{"$ref":"#/components/headers/X-RateLimit-Limit"},"X-RateLimit-Remaining":{"$ref":"#/components/headers/X-RateLimit-Remaining"},"X-RateLimit-Reset":{"$ref":"#/components/headers/X-RateLimit-Reset"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Either API access is not included in the account plan (<code>errorCode</code> is <code>forbidden</code>), or the application token is read-only and this endpoint writes (<code>errorCode</code> is <code>insufficient_scope</code>). A read-only token is refused here before any credit is spent; issue a full-scope token under Settings > Applications to write.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"413":{"description":"The uploaded bytes exceed the account size limit, or a single multipart chunk exceeds 3 MB. On a chunked upload this is returned on the chunk that crosses the limit, not at assemble, and the chunks already stored are dropped. Only the bytes sent are measured: a gzipped dump counts as its compressed size. Also returned when a gzipped dump expands past 30 times the limit. <code>errorCode</code> is <code>file_too_large</code>","headers":{"X-RateLimit-Limit":{"$ref":"#/components/headers/X-RateLimit-Limit"},"X-RateLimit-Remaining":{"$ref":"#/components/headers/X-RateLimit-Remaining"},"X-RateLimit-Reset":{"$ref":"#/components/headers/X-RateLimit-Reset"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"415":{"description":"File rejected by the parser. <code>errorCode</code> is <code>parsing_issue</code> (corrupt or unsupported dump, generic message) or <code>other_issue</code> (invalid file or format too old, specific message)","headers":{"X-RateLimit-Limit":{"$ref":"#/components/headers/X-RateLimit-Limit"},"X-RateLimit-Remaining":{"$ref":"#/components/headers/X-RateLimit-Remaining"},"X-RateLimit-Reset":{"$ref":"#/components/headers/X-RateLimit-Reset"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"429":{"description":"Rate limit exceeded. This endpoint counts in the <code>ingest</code> bucket (30 requests per minute per account); multipart chunks count in the <code>chunk</code> bucket (600 per minute). Also returned on a chunk when the account's staged chunks reach twice its limit (no cap on unlimited accounts): the chunk is not stored, retry it. <code>errorCode</code> is <code>rate_limited</code>; retry after <code>Retry-After</code> seconds","headers":{"Retry-After":{"$ref":"#/components/headers/Retry-After"},"X-RateLimit-Limit":{"$ref":"#/components/headers/X-RateLimit-Limit"},"X-RateLimit-Remaining":{"$ref":"#/components/headers/X-RateLimit-Remaining"},"X-RateLimit-Reset":{"$ref":"#/components/headers/X-RateLimit-Reset"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"},"example":{"error":"Rate limit exceeded, retry after 42 s","errorCode":"rate_limited"}}}},"500":{"description":"Unexpected processing error, or the upload storage is unavailable on a chunk or an assemble. <code>errorCode</code> is <code>other_issue</code>; a generic message is returned and internal error details are not exposed","headers":{"X-RateLimit-Limit":{"$ref":"#/components/headers/X-RateLimit-Limit"},"X-RateLimit-Remaining":{"$ref":"#/components/headers/X-RateLimit-Remaining"},"X-RateLimit-Reset":{"$ref":"#/components/headers/X-RateLimit-Reset"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}},"/v1.0/analyze":{"post":{"summary":"Analyze","description":"Upload a webrtc-internal file or a rtcstats file, process it and return summary, observations and scores. By default the session is not stored: pass query <code>save=true</code> (or <code>save=1</code>) to also persist the dump like <code>/upload</code>; with <code>save=true</code>, an assemble repeated within 24 h with the same <code>fileId</code> returns <code>200</code> with the original body and consumes no credit.<br/><br/>Send the dump the same way as <code>/upload</code>: upload the file in chunks, then send a small JSON assemble request.<br/><br/>This API consumes one credit if successful.","operationId":"analyze","tags":["rtcStats API"],"security":[{"BearerAuth":[]}],"parameters":[{"name":"save","in":"query","required":false,"schema":{"type":"string"},"description":"When <code>true</code> or <code>1</code>, store the file in the account in addition to returning the analysis JSON."}],"requestBody":{"content":{"application/octet-stream":{"schema":{"type":"string","format":"binary"}},"multipart/form-data":{"schema":{"type":"object","required":["chunk","fileId","chunkIndex"],"properties":{"chunk":{"type":"string","format":"binary","description":"Binary chunk of the dump file. 3 MB maximum per chunk, 1 MB recommended; a larger chunk returns 413 file_too_large."},"fileId":{"type":"string","description":"Client-generated id for this chunked upload (same value for all chunks and assemble)."},"chunkIndex":{"type":"string"}}}},"application/json":{"schema":{"type":"object","required":["fileId","assemble"],"properties":{"fileId":{"type":"string","description":"Same id used when uploading chunks."},"assemble":{"type":"boolean","description":"Must be <code>true</code>. Detection is shape-based: the JSON body must be at most 1KB and match this shape, otherwise it is processed as a raw JSON dump."},"fileName":{"type":"string","description":"Optional. With <code>save=true</code>, used as the stored session's file name (extension stripped for the title) and mirrored in the response <code>data.fileName</code> / <code>data.title</code>. Ignored without save."}}}}}},"responses":{"200":{"description":"Success. Analysis result for a raw body or an assemble request; <code>{ success: true }</code> for a chunk request (chunk stored, nothing analyzed yet)","headers":{"X-RateLimit-Limit":{"$ref":"#/components/headers/X-RateLimit-Limit"},"X-RateLimit-Remaining":{"$ref":"#/components/headers/X-RateLimit-Remaining"},"X-RateLimit-Reset":{"$ref":"#/components/headers/X-RateLimit-Reset"}},"content":{"application/json":{"schema":{"oneOf":[{"type":"object","required":["data","processorVersion"],"properties":{"data":{"$ref":"#/components/schemas/AnalyzeResponseData"},"rtcstatsId":{"type":"string","description":"The rtcstats session identifier when <code>save</code> was used; otherwise absent."},"rtcstatsUrl":{"type":"string","description":"Dashboard URL to open the rtcstats session when <code>save</code> was used; otherwise absent."},"processorVersion":{"type":"string","description":"Version of the @rtcstats/rtcstats-processor package that produced the analysis (semver, e.g. 1.9.0). Resolved at response time."},"embedUrl":{"type":"string","description":"URL to open the session in the embedded viewer. Only present on the Enterprise plan when <code>save</code> was used."}}},{"type":"object","required":["success"],"properties":{"success":{"type":"boolean","description":"Returned for multipart chunk requests: the chunk was stored, no analysis has run yet."}}}]}}}},"400":{"description":"Invalid request: empty body, failed decompression, an unparsable multipart body, or no chunks found for the given fileId. <code>errorCode</code> is <code>invalid_request</code>","headers":{"X-RateLimit-Limit":{"$ref":"#/components/headers/X-RateLimit-Limit"},"X-RateLimit-Remaining":{"$ref":"#/components/headers/X-RateLimit-Remain