source: https://rtcstats.com/api-docs.md + https://rtcstats.com/tos + https://rtcstats.com/blog/category/release
description: >-
  rtcStats versions its REST API in the URI path (v1.0) and versions the product
  on a monthly minor cadence announced on the blog. There is no separate
  versioning or deprecation policy document, no Sunset/Deprecation header
  support, no status page and — stated explicitly in the Terms of Service — no
  service-level agreement for most services.
versioning:
  scheme: uri-path
  current: v1.0
  example: https://api.rtcstats.com/v1.0/sessions
  policy_url: null
  detail: >-
    A single API version has shipped. Separately, the analysis payload carries
    its own schema version (documented in llms.txt as schema 6.3, with a note
    that schema 6.9 removed the former unitless aggregate keys such as
    rtt_out_audio and in_audio), and every analysis response reports
    processorVersion — the @rtcstats/rtcstats-processor semver, e.g. 1.9.0.
product_versioning:
  scheme: semver-minor-monthly
  current: '1.9'
  released: '2026-08-03'
  announcement_channel: https://rtcstats.com/blog/category/release
  detail: changelog/rtcstats-changelog.yml
deprecation:
